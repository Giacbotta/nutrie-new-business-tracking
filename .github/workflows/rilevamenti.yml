# Rilevamenti di Nutrie (bacheca S-16, E-90 ed E-91).
# Gli orari cron di GitHub sono in UTC: 05-21 UTC = 07-23 ora italiana d'estate (dal 25/10 diventano 06-22).
# Minuto :01 dal 22/09/2026: il primo giorno le esecuzioni a :00 non erano mai partite.
name: rilevamenti

on:
  schedule:
    - cron: "1 5-21/2 * * *"   # Playtomic "rileva", ogni 2 ore
    - cron: "1 19 * * *"       # Playtomic "anticipo", una volta al giorno
    - cron: "1 7 * * 1"        # bandi comunali, lunedì
    - cron: "31 7 * * 1"       # lavanderie in vendita (E-91), lunedì
  workflow_dispatch:
    inputs:
      comando:
        description: "rileva, anticipo, bandi o lavanderie"
        required: true
        default: "rileva"

permissions:
  contents: write
  issues: write   # E-91: la notifica delle lavanderie nuove è una issue, che GitHub manda per email

concurrency:
  group: rilevamenti
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scegli il comando
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then c="${{ github.event.inputs.comando }}"
          elif [ "${{ github.event.schedule }}" = "1 19 * * *" ]; then c="anticipo"
          elif [ "${{ github.event.schedule }}" = "1 7 * * 1" ]; then c="bandi"
          elif [ "${{ github.event.schedule }}" = "31 7 * * 1" ]; then c="lavanderie"
          else c="rileva"; fi
          echo "c=$c" >> "$GITHUB_OUTPUT"

      - name: Esegui
        id: esegui
        run: |
          c="${{ steps.cmd.outputs.c }}"
          if [ "$c" = "rileva" ] || [ "$c" = "anticipo" ]; then
            if [ "$(date +%Y%m%d)" -gt 20261009 ]; then echo "Rilevamento Playtomic concluso il 09/10/2026 (S-16)"; exit 0; fi
            python rilevamento_playtomic.py "$c" && python rilevamento_playtomic.py riepilogo_csv
          elif [ "$c" = "bandi" ]; then python bandi_comunali.py controlla
          elif [ "$c" = "lavanderie" ]; then pip install --quiet curl_cffi && python lavanderie_vendita.py controlla
          fi

      - name: Salva i dati nel repository
        run: |
          git config user.name "nutrie-rilevamenti"
          git config user.email "actions@users.noreply.github.com"
          git add dati/
          git diff --cached --quiet || git commit -m "dati: ${{ steps.cmd.outputs.c }} $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash && git push

      # L'issue menziona il proprietario del repository: GitHub gli manda l'email, senza password né servizi esterni
      - name: Avvisa per email se ci sono lavanderie nuove
        if: steps.cmd.outputs.c == 'lavanderie' && steps.esegui.outputs.novita == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "@${{ github.repository_owner }}"; echo; cat dati/lavanderie-email.md; } > corpo.md
          gh issue create --title "Lavanderie in vendita PD/TV/VE: ${{ steps.esegui.outputs.nuovi }} nuove, giro del $(date +%d/%m/%Y)" --body-file corpo.md
