# Nutrie new business tracking (board items S-16, E-90 and E-91).
# GitHub cron times are UTC: 05-21 UTC = 07-23 Italian summer time (from 25/10 they become 06-22).
# Minute :01 since 22/09/2026: on the first day the runs at :00 never started.
name: tracking

on:
  schedule:
    - cron: "1 5-21/2 * * *"   # Playtomic "read", every 2 hours
    - cron: "1 19 * * *"       # Playtomic "lead", once a day
    - cron: "1 7 * * 1"        # municipal tenders, Monday
    - cron: "31 7 * * 1"       # laundromats for sale (E-91), Monday
    # E-91 retries: a portal can block for a whole day. "weekly" stops by itself once the week's
    # round has read every portal, so these cost nothing when Monday worked.
    - cron: "31 11,17 * * 1"   # same Monday, a few hours later
    - cron: "31 7,17 * * 2"    # Tuesday
    - cron: "31 7 * * 3"       # Wednesday, last attempt of the week
    - cron: "6 4-21 * * *"     # Radical Storage occupancy (E-93), every hour 06-23 Italian summer time
    - cron: "6 3 * * 1"        # Radical Storage census (E-93), Monday
  workflow_dispatch:
    inputs:
      command:
        description: "playtomic, playtomic-lead, tenders, laundromats (skips if the week worked), laundromats-now, radical or radical-census"
        required: true
        default: "laundromats"

permissions:
  contents: write
  issues: write   # E-91: new laundromats are notified with an issue, which GitHub sends by email

concurrency:
  group: tracking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then c="${{ github.event.inputs.command }}"
          elif [ "${{ github.event.schedule }}" = "1 19 * * *" ]; then c="playtomic-lead"
          elif [ "${{ github.event.schedule }}" = "1 7 * * 1" ]; then c="tenders"
          elif [ "${{ github.event.schedule }}" = "31 7 * * 1" ]; then c="laundromats"
          elif [ "${{ github.event.schedule }}" = "31 11,17 * * 1" ]; then c="laundromats"
          elif [ "${{ github.event.schedule }}" = "31 7,17 * * 2" ]; then c="laundromats"
          elif [ "${{ github.event.schedule }}" = "31 7 * * 3" ]; then c="laundromats"
          elif [ "${{ github.event.schedule }}" = "6 4-21 * * *" ]; then c="radical"
          elif [ "${{ github.event.schedule }}" = "6 3 * * 1" ]; then c="radical-census"
          else c="playtomic"; fi
          echo "c=$c" >> "$GITHUB_OUTPUT"

      - name: Run
        id: run
        run: |
          c="${{ steps.cmd.outputs.c }}"
          if [ "$c" = "playtomic" ] || [ "$c" = "playtomic-lead" ]; then
            if [ "$(date +%Y%m%d)" -gt 20261009 ]; then echo "Playtomic sampling ended on 09/10/2026 (S-16)"; exit 0; fi
            pip install --quiet curl_cffi || true   # Playtomic answers 403 to plain requests from GitHub (23/09/2026)
            if [ "$c" = "playtomic" ]; then python playtomic_occupancy.py read; else python playtomic_occupancy.py lead; fi
            python playtomic_occupancy.py summary_csv
          elif [ "$c" = "tenders" ]; then python municipal_tenders.py check
          elif [ "$c" = "laundromats" ]; then pip install --quiet curl_cffi && python laundromats_for_sale.py weekly
          elif [ "$c" = "laundromats-now" ]; then pip install --quiet curl_cffi && python laundromats_for_sale.py check
          elif [ "$c" = "radical" ]; then
            python radical_occupancy.py scan && python radical_occupancy.py daily && python radical_occupancy.py dashboard
          elif [ "$c" = "radical-census" ]; then
            python radical_occupancy.py cities && python radical_occupancy.py census
          else echo "Unknown command: $c"; exit 1
          fi

      - name: Save the data in the repository
        run: |
          git config user.name "nutrie-tracking"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "data: ${{ steps.cmd.outputs.c }} $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash && git push

      # The issue mentions the repository owner: GitHub emails it, no password and no external service
      - name: Email if laundromats changed, or if a portal stayed blocked all week
        if: (startsWith(steps.cmd.outputs.c, 'laundromats')) && (steps.run.outputs.changes == 'yes' || steps.run.outputs.alert == 'yes')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "@${{ github.repository_owner }}"; echo; cat data/laundromats-email.md; } > body.md
          if [ "${{ steps.run.outputs.alert }}" = "yes" ]; then t="Laundromats PD/TV/VE: a portal was unreachable all week"
          else t="Laundromats for sale PD/TV/VE: ${{ steps.run.outputs.new }} new, run of $(date +%d/%m/%Y)"; fi
          gh issue create --title "$t" --body-file body.md
